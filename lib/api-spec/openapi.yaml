openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PlatePair API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session management
  - name: users
    description: User operations
  - name: groups
    description: Group operations
  - name: meals
    description: Meal post operations
  - name: videos
    description: Cooking hack video operations
  - name: feed
    description: Feed operations
  - name: engagement
    description: Likes, saves, comments
  - name: battles
    description: Battle Engine — cooking challenges and tournaments
  - name: onboarding
    description: Multi-tier onboarding flow
  - name: partner
    description: Partner brand portal
  - name: judge
    description: Judge queue and assignments
paths:
  # AUTH
  /auth/user:
    get:
      tags: [auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to returnTo on success or /api/login on failure.
  /logout:
    get:
      tags: [auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

  # ONBOARDING
  /onboarding/status:
    get:
      tags: [onboarding]
      operationId: getOnboardingStatus
      summary: Get current user's onboarding status
      responses:
        '200':
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
  /onboarding/complete:
    post:
      tags: [onboarding]
      operationId: completeOnboarding
      summary: Complete onboarding and set user roles + profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteOnboardingBody'
      responses:
        '200':
          description: Onboarding completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  # PARTNER
  /partner/profile:
    get:
      tags: [partner]
      operationId: getPartnerProfile
      summary: Get the current user's partner profile
      responses:
        '200':
          description: Partner profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProfile'
    post:
      tags: [partner]
      operationId: createPartnerProfile
      summary: Create or update partner profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePartnerProfileBody'
      responses:
        '200':
          description: Partner profile created/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProfile'
  /partner/battles:
    get:
      tags: [partner]
      operationId: getPartnerBattles
      summary: Get battles sponsored by this partner
      responses:
        '200':
          description: Partner battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BattleWithDetails'
  /partner/sponsor:
    post:
      tags: [partner]
      operationId: sponsorBattle
      summary: Sponsor a battle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SponsorBattleBody'
      responses:
        '200':
          description: Sponsorship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleSponsorship'

  # JUDGE
  /judge/profile:
    get:
      tags: [judge]
      operationId: getJudgeProfile
      summary: Get the current user's judge profile
      responses:
        '200':
          description: Judge profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeProfile'
    post:
      tags: [judge]
      operationId: createJudgeProfile
      summary: Create or update judge profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJudgeProfileBody'
      responses:
        '200':
          description: Judge profile created/updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeProfile'
  /judge/assignments:
    get:
      tags: [judge]
      operationId: getJudgeAssignments
      summary: Get battles assigned to this judge
      responses:
        '200':
          description: Judge assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JudgeAssignmentWithBattle'
  /judge/assignments/{assignmentId}/accept:
    post:
      tags: [judge]
      operationId: acceptJudgeAssignment
      summary: Accept a judge assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Assignment accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeAssignmentWithBattle'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/stats:
    get:
      operationId: getUserStats
      tags: [users]
      summary: Get user activity stats
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  # GROUPS
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all public groups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group by ID
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List members of a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupBody"
      responses:
        "201":
          description: Joined group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMember"

  /groups/{groupId}/stats:
    get:
      operationId: getGroupStats
      tags: [groups]
      summary: Get group activity stats
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupStats"

  /users/{userId}/groups:
    get:
      operationId: getUserGroups
      tags: [groups]
      summary: Get groups a user belongs to
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"

  # MEALS
  /meals:
    get:
      operationId: listMeals
      tags: [meals]
      summary: List meals
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: authorId
          in: query
          required: false
          schema:
            type: integer
        - name: mealType
          in: query
          required: false
          schema:
            type: string
        - name: shareStatus
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealWithAuthor"
    post:
      operationId: createMeal
      tags: [meals]
      summary: Create a meal post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealBody"
      responses:
        "201":
          description: Created meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWithAuthor"

  /meals/{mealId}:
    get:
      operationId: getMeal
      tags: [meals]
      summary: Get a meal by ID
      parameters:
        - name: mealId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meal found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWithAuthor"
    patch:
      operationId: updateMeal
      tags: [meals]
      summary: Update a meal
      parameters:
        - name: mealId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMealBody"
      responses:
        "200":
          description: Updated meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWithAuthor"
    delete:
      operationId: deleteMeal
      tags: [meals]
      summary: Delete a meal
      parameters:
        - name: mealId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /meals/trending:
    get:
      operationId: getTrendingMeals
      tags: [meals]
      summary: Get trending meals (most liked/saved recently)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Trending meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealWithAuthor"

  # VIDEOS
  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List cooking hack videos
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: authorId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: hackStatus
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, community_voting, ai_reviewing, approved, challenged, rejected]
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoWithAuthor"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Create a cooking hack video post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoBody"
      responses:
        "201":
          description: Created video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWithAuthor"

  /videos/{videoId}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a video by ID
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWithAuthor"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /videos/{videoId}/vote:
    post:
      operationId: voteOnHack
      tags: [videos]
      summary: Cast or toggle a community vote on a hack
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HackVoteBody"
      responses:
        "200":
          description: Updated video with vote counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWithAuthor"

  /videos/{videoId}/submit-for-review:
    post:
      operationId: submitHackForReview
      tags: [videos]
      summary: Submit a hack for AI review (requires minimum community upvotes)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "200":
          description: AI review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HackReviewResult"

  /videos/{videoId}/ai-review:
    post:
      operationId: triggerHackAIReview
      tags: [videos]
      summary: Directly trigger AI review on a hack (admin)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "200":
          description: AI review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HackReviewResult"

  # FEED
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get mixed home feed (meals + videos)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Feed items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /feed/summary:
    get:
      operationId: getFeedSummary
      tags: [feed]
      summary: Get feed summary stats (counts, active cooks, etc.)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Feed summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedSummary"

  # ENGAGEMENT
  /reactions:
    post:
      operationId: toggleReaction
      tags: [engagement]
      summary: Toggle a like/reaction on a meal or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleReactionBody"
      responses:
        "200":
          description: Reaction toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResult"

  /saves:
    post:
      operationId: toggleSave
      tags: [engagement]
      summary: Toggle save/bookmark on a meal or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleSaveBody"
      responses:
        "200":
          description: Save toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"

  /users/{userId}/saves:
    get:
      operationId: getUserSaves
      tags: [engagement]
      summary: Get saved items for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedItemsResponse"

  /comments:
    post:
      operationId: createComment
      tags: [engagement]
      summary: Post a comment on a meal or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{targetType}/{targetId}:
    get:
      operationId: listComments
      tags: [engagement]
      summary: List comments on a meal or video
      parameters:
        - name: targetType
          in: path
          required: true
          schema:
            type: string
            enum: [meal, video]
        - name: targetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

  # BATTLES
  /battles:
    get:
      operationId: listBattles
      tags: [battles]
      summary: List battles
      parameters:
        - name: scopeType
          in: query
          required: false
          schema:
            type: string
            enum: [private, circle, local, public, global]
        - name: battleStatus
          in: query
          required: false
          schema:
            type: string
            enum: [draft, open, live, judging, completed, archived]
        - name: challengeType
          in: query
          required: false
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleWithDetails"
    post:
      operationId: createBattle
      tags: [battles]
      summary: Create a new battle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBattleBody"
      responses:
        "201":
          description: Created battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleWithDetails"

  /battles/{battleId}:
    get:
      operationId: getBattle
      tags: [battles]
      summary: Get a battle by ID
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Battle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleWithDetails"

  /battles/{battleId}/entries:
    get:
      operationId: listBattleEntries
      tags: [battles]
      summary: List entries for a battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleEntryWithUser"
    post:
      operationId: submitBattleEntry
      tags: [battles]
      summary: Submit an entry for a battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEntryBody"
      responses:
        "201":
          description: Entry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleEntryWithUser"

  /battles/{battleId}/interest:
    post:
      operationId: trackBattleInterest
      tags: [battles]
      summary: Track user interest/intent for a battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackInterestBody"
      responses:
        "201":
          description: Interest tracked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /battles/{battleId}/join:
    post:
      operationId: joinBattle
      tags: [battles]
      summary: Join a battle (register as participant)
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinBattleBody"
      responses:
        "200":
          description: Joined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  participantCount:
                    type: integer
                required:
                  - ok
                  - participantCount

  /battles/{battleId}/bookmark:
    post:
      operationId: toggleBattleBookmark
      tags: [battles]
      summary: Toggle bookmark (save) a battle for the current user
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bookmark toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarked:
                    type: boolean
                required:
                  - bookmarked

  /battles/{battleId}/invite-link:
    get:
      operationId: getBattleInviteLink
      tags: [battles]
      summary: Get or generate an invite link for a battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite link
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteCode:
                    type: string
                  inviteUrl:
                    type: string
                required:
                  - inviteCode
                  - inviteUrl

  /battles/hot:
    get:
      operationId: getHotBattles
      tags: [battles]
      summary: Get hot and trending battles
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Hot battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Battle"

  /battles/recommended:
    get:
      operationId: getRecommendedBattles
      tags: [battles]
      summary: Get battles recommended for the current user based on affinity
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recommended battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Battle"

  /battles/score-candidate:
    post:
      operationId: scoreBattleCandidate
      tags: [battles]
      summary: Score a meal or video as a battle candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreCandidateBody"
      responses:
        "200":
          description: Battle-worthiness score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateScore"

  /battles/from-content:
    post:
      operationId: createBattleFromContent
      tags: [battles]
      summary: Auto-generate a battle from a meal or video post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFromContentBody"
      responses:
        "201":
          description: Battle generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleWithDetails"

  /battles/leaderboard:
    get:
      operationId: getBattleLeaderboard
      tags: [battles]
      summary: Get overall battle leaderboard
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /users/{userId}/battles:
    get:
      operationId: getUserBattles
      tags: [battles]
      summary: Get battles a user is participating in
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleWithDetails"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUploadUrlBody'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUploadUrlResponse'
        '400':
          description: Missing or invalid fields.

  /ai/hack-review/{videoId}:
    post:
      tags: [ai]
      operationId: runAiHackReview
      summary: Run AI review on a hack submission
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: AI review result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiHackReviewResult'

  /ai/battle-description:
    post:
      tags: [ai]
      operationId: generateBattleDescription
      summary: Generate an AI battle description from a title and source URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateBattleDescriptionBody'
      responses:
        '200':
          description: Generated description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateBattleDescriptionResponse'

components:
  schemas:
    HealthStatus:
