openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: PlatePair API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User operations
  - name: groups
    description: Group operations
  - name: meals
    description: Meal post operations
  - name: videos
    description: Cooking hack video operations
  - name: feed
    description: Feed operations
  - name: engagement
    description: Likes, saves, comments
  - name: battles
    description: Battle Engine — cooking challenges and tournaments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/stats:
    get:
      operationId: getUserStats
      tags: [users]
      summary: Get user activity stats
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  # GROUPS
  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: List all public groups
      responses:
        "200":
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get a group by ID
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List members of a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupBody"
      responses:
        "201":
          description: Joined group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMember"

  /groups/{groupId}/stats:
    get:
      operationId: getGroupStats
      tags: [groups]
      summary: Get group activity stats
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Group stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupStats"

  /users/{userId}/groups:
    get:
      operationId: getUserGroups
      tags: [groups]
      summary: Get groups a user belongs to
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"

  # MEALS
  /meals:
    get:
      operationId: listMeals
      tags: [meals]
      summary: List meals
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: authorId
          in: query
          required: false
          schema:
            type: integer
        - name: mealType
          in: query
          required: false
          schema:
            type: string
        - name: shareStatus
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealWithAuthor"
    post:
      operationId: createMeal
      tags: [meals]
      summary: Create a meal post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMealBody"
      responses:
        "201":
          description: Created meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWithAuthor"

  /meals/{mealId}:
    get:
      operationId: getMeal
      tags: [meals]
      summary: Get a meal by ID
      parameters:
        - name: mealId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Meal found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWithAuthor"
    patch:
      operationId: updateMeal
      tags: [meals]
      summary: Update a meal
      parameters:
        - name: mealId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMealBody"
      responses:
        "200":
          description: Updated meal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealWithAuthor"
    delete:
      operationId: deleteMeal
      tags: [meals]
      summary: Delete a meal
      parameters:
        - name: mealId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /meals/trending:
    get:
      operationId: getTrendingMeals
      tags: [meals]
      summary: Get trending meals (most liked/saved recently)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Trending meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MealWithAuthor"

  # VIDEOS
  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List cooking hack videos
      parameters:
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: authorId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
        - name: hackStatus
          in: query
          required: false
          schema:
            type: string
            enum: [submitted, community_voting, ai_reviewing, approved, challenged, rejected]
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoWithAuthor"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Create a cooking hack video post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoBody"
      responses:
        "201":
          description: Created video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWithAuthor"

  /videos/{videoId}:
    get:
      operationId: getVideo
      tags: [videos]
      summary: Get a video by ID
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Video found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWithAuthor"
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /videos/{videoId}/vote:
    post:
      operationId: voteOnHack
      tags: [videos]
      summary: Cast or toggle a community vote on a hack
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HackVoteBody"
      responses:
        "200":
          description: Updated video with vote counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoWithAuthor"

  /videos/{videoId}/submit-for-review:
    post:
      operationId: submitHackForReview
      tags: [videos]
      summary: Submit a hack for AI review (requires minimum community upvotes)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "200":
          description: AI review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HackReviewResult"

  /videos/{videoId}/ai-review:
    post:
      operationId: triggerHackAIReview
      tags: [videos]
      summary: Directly trigger AI review on a hack (admin)
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
              required: [userId]
      responses:
        "200":
          description: AI review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HackReviewResult"

  # FEED
  /feed:
    get:
      operationId: getFeed
      tags: [feed]
      summary: Get mixed home feed (meals + videos)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Feed items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"

  /feed/summary:
    get:
      operationId: getFeedSummary
      tags: [feed]
      summary: Get feed summary stats (counts, active cooks, etc.)
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Feed summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedSummary"

  # ENGAGEMENT
  /reactions:
    post:
      operationId: toggleReaction
      tags: [engagement]
      summary: Toggle a like/reaction on a meal or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleReactionBody"
      responses:
        "200":
          description: Reaction toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResult"

  /saves:
    post:
      operationId: toggleSave
      tags: [engagement]
      summary: Toggle save/bookmark on a meal or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleSaveBody"
      responses:
        "200":
          description: Save toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"

  /users/{userId}/saves:
    get:
      operationId: getUserSaves
      tags: [engagement]
      summary: Get saved items for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedItemsResponse"

  /comments:
    post:
      operationId: createComment
      tags: [engagement]
      summary: Post a comment on a meal or video
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{targetType}/{targetId}:
    get:
      operationId: listComments
      tags: [engagement]
      summary: List comments on a meal or video
      parameters:
        - name: targetType
          in: path
          required: true
          schema:
            type: string
            enum: [meal, video]
        - name: targetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

  # BATTLES
  /battles:
    get:
      operationId: listBattles
      tags: [battles]
      summary: List battles
      parameters:
        - name: scopeType
          in: query
          required: false
          schema:
            type: string
            enum: [private, circle, local, public, global]
        - name: battleStatus
          in: query
          required: false
          schema:
            type: string
            enum: [draft, open, live, judging, completed, archived]
        - name: challengeType
          in: query
          required: false
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleWithDetails"
    post:
      operationId: createBattle
      tags: [battles]
      summary: Create a new battle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBattleBody"
      responses:
        "201":
          description: Created battle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleWithDetails"

  /battles/{battleId}:
    get:
      operationId: getBattle
      tags: [battles]
      summary: Get a battle by ID
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Battle found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleWithDetails"

  /battles/{battleId}/entries:
    get:
      operationId: listBattleEntries
      tags: [battles]
      summary: List entries for a battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleEntryWithUser"
    post:
      operationId: submitBattleEntry
      tags: [battles]
      summary: Submit an entry for a battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitEntryBody"
      responses:
        "201":
          description: Entry submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleEntryWithUser"

  /battles/{battleId}/interest:
    post:
      operationId: trackBattleInterest
      tags: [battles]
      summary: Track user interest/intent for a battle
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackInterestBody"
      responses:
        "201":
          description: Interest tracked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /battles/{battleId}/join:
    post:
      operationId: joinBattle
      tags: [battles]
      summary: Join a battle (register as participant)
      parameters:
        - name: battleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinBattleBody"
      responses:
        "200":
          description: Joined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  participantCount:
                    type: integer
                required:
                  - ok
                  - participantCount

  /battles/score-candidate:
    post:
      operationId: scoreBattleCandidate
      tags: [battles]
      summary: Score a meal or video as a battle candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreCandidateBody"
      responses:
        "200":
          description: Battle-worthiness score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateScore"

  /battles/from-content:
    post:
      operationId: createBattleFromContent
      tags: [battles]
      summary: Auto-generate a battle from a meal or video post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFromContentBody"
      responses:
        "201":
          description: Battle generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BattleWithDetails"

  /battles/leaderboard:
    get:
      operationId: getBattleLeaderboard
      tags: [battles]
      summary: Get overall battle leaderboard
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /users/{userId}/battles:
    get:
      operationId: getUserBattles
      tags: [battles]
      summary: Get battles a user is participating in
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User's battles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BattleWithDetails"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: integer
        displayName:
          type: string
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        locationText:
          type: string
          nullable: true
        dietaryPreferences:
          type: array
          items:
            type: string
        cookingInterests:
          type: array
          items:
            type: string
        role:
          type: string
          enum: [user, moderator, admin]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - displayName
        - username
        - email
        - dietaryPreferences
        - cookingInterests
        - role
        - createdAt

    CreateUserBody:
      type: object
      properties:
        displayName:
          type: string
        username:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        locationText:
          type: string
          nullable: true
        dietaryPreferences:
          type: array
          items:
            type: string
        cookingInterests:
          type: array
          items:
            type: string
      required:
        - displayName
        - username
        - email

    UpdateUserBody:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        locationText:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        dietaryPreferences:
          type: array
          items:
            type: string
        cookingInterests:
          type: array
          items:
            type: string

    UserStats:
      type: object
      properties:
        userId:
          type: integer
        totalMeals:
          type: integer
        totalVideos:
          type: integer
        totalSaves:
          type: integer
        totalLikes:
          type: integer
        groupCount:
          type: integer
        joinedAt:
          type: string
          format: date-time
      required:
        - userId
        - totalMeals
        - totalVideos
        - totalSaves
        - totalLikes
        - groupCount
        - joinedAt

    Group:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        coverImageUrl:
          type: string
          nullable: true
        visibility:
          type: string
          enum: [public, private, invite_only]
        createdById:
          type: integer
        memberCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - visibility
        - createdById
        - memberCount
        - tags
        - createdAt

    CreateGroupBody:
      type: object
      properties:
        name:
          type: string
        slug:
