services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://platepair:platepair@db:5432/platepair
      NODE_ENV: production
      # Replit OIDC — set REPL_ID if you want "Sign in with Replit" to work.
      # Email/password auth works without it.
      # REPL_ID: your-repl-id-here
      # ISSUER_URL: https://replit.com/oidc
      #
      # Optional: auto-promote a user to admin on first boot
      # ADMIN_EMAIL: you@example.com
      #
      # Optional: OpenAI key for AI features
      # OPENAI_API_KEY: sk-...
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platepair
      POSTGRES_PASSWORD: platepair
      POSTGRES_DB: platepair
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platepair"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
